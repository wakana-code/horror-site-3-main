<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google</title>
<link id="favicon" rel="icon" href="">
<!--
  ここまで読みに来たんだね。

  彼は、紙に写されるのを嫌う。
  紙の上では、彼は嘘を書き換えられないから。

  そして、彼が聞いていない場所がひとつだけある。
  開発者だけが覗く、あの黒い窓。
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;color:#202124;background:#fff;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer}
body.nocursor,body.nocursor *{cursor:none!important}
#print-secret{display:none}
@media print{
  #app,#layer{display:none!important}
  #print-secret{display:block!important;white-space:pre-wrap;padding:48px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15pt;line-height:2.1;color:#000}
}

/* ===== Google ===== */
.g-top{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:6px 14px;height:60px;font-size:13px}
.g-top>a{padding:0 6px}
.g-top>a:hover{text-decoration:underline}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:none;background:none;padding:0}
.icon-btn:hover{background:rgba(60,64,67,.08)}
.avatar{width:32px;height:32px;border-radius:50%;background:#7b1fa2;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex:none;margin:4px}
.g-main{display:flex;flex-direction:column;align-items:center;padding-top:calc$24vh - 60px$}
.logo{font-family:"Product Sans","Google Sans",Arial,sans-serif;font-size:90px;letter-spacing:-3px;user-select:none;line-height:1.1;margin-bottom:26px;white-space:nowrap;position:relative;cursor:default}
.logo span{display:inline-block}
.logo.small{font-size:30px;letter-spacing:-1px;margin:0;cursor:pointer}
.logo .dz{width:.62em;height:.62em;vertical-align:-.02em;margin:0 .02em}
.sform{width:100%;max-width:584px;position:relative;z-index:5}
.sbox{display:flex;align-items:center;height:46px;border:1px solid #dfe1e5;border-radius:24px;padding:0 8px 0 14px;background:#fff;gap:10px}
.sform:hover .sbox,.sform.focus .sbox{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.sform.open .sbox{border-radius:24px 24px 0 0;box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.sbox input{flex:1;border:none;outline:none;font-size:16px;height:100%;background:transparent;color:#202124}
.sbox .ic-r{display:flex;gap:8px;align-items:center;padding-right:6px}
.sugg{display:none;position:absolute;left:0;right:0;top:45px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 4px 6px rgba(32,33,36,.28);padding:6px 0 14px;overflow:hidden;border-top:1px solid #e8eaed}
.sform.open .sugg{display:block}
.sg-item{display:flex;align-items:center;gap:14px;padding:6px 20px;font-size:16px;cursor:default}
.sg-item:hover{background:#f1f3f4}
.sg-item.hist .sg-t{color:#681da8}
.sg-del{margin-left:auto;font-size:13px;color:#70757a;text-decoration:underline;cursor:pointer}
.btns{display:flex;justify-content:center;margin-top:28px}
.gbtn{background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;color:#3c4043;font-size:14px;margin:0 6px;padding:0 16px;height:36px}
.gbtn:hover{border-color:#dadce0;box-shadow:0 1px 1px rgba(0,0,0,.1);color:#202124}
.langs{font-size:13px;color:#4d5156;margin-top:28px}
.langs a{color:#1a0dab;margin:0 4px}
.doodle-cap{font-size:13px;color:#70757a;margin:-16px 0 20px}
.g-foot{position:fixed;bottom:0;left:0;right:0;background:#f2f2f2;color:#70757a;font-size:14px}
.gf-row{padding:0 20px;display:flex;justify-content:space-between;flex-wrap:wrap}
.gf-c{padding:15px 30px;border-bottom:1px solid #dadce0}
.gf-row a{display:inline-block;padding:15px}
.gf-row a:hover{text-decoration:underline}
.pop{position:fixed;background:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:9000;padding:8px 0;font-size:14px;min-width:220px;color:#202124}
.pop .pi{display:block;padding:10px 18px;cursor:pointer}
.pop .pi:hover{background:#f1f3f4}
.pop .ph{padding:14px 18px;border-bottom:1px solid #e8eaed;margin-bottom:6px}
.pop .ph small{display:block;color:#5f6368}
.apps{display:grid;grid-template-columns:repeat(3,96px);gap:4px;padding:16px;border-radius:24px;background:#e9eef6}
.apps a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;font-size:13px;text-align:center;min-height:84px}
.apps a:hover{background:#d3e3fd}
.app-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:15px}

/* results */
.r-head{display:flex;align-items:center;padding:20px 20px 0 28px;gap:36px}
.r-head .sform{max-width:692px}
.r-right{margin-left:auto;display:flex;align-items:center}
.tabs{display:flex;gap:4px;padding-left:178px;margin-top:10px;border-bottom:1px solid #ebebeb;font-size:14px}
.tabs a{padding:12px;color:#5f6368}
.tabs a.on{color:#1f1f1f;border-bottom:3px solid #1f1f1f;font-weight:bold}
.r-body{padding-left:178px;max-width:830px;padding-bottom:20px}
.stats{color:#70757a;font-size:14px;padding:12px 0 14px}
.res{margin:0 0 30px;max-width:652px}
.res .src{display:flex;align-items:center;gap:12px;font-size:14px;color:#202124}
.res .fav{width:28px;height:28px;border-radius:50%;background:#f1f3f4;border:1px solid #ecedef;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#555;flex:none;overflow:hidden}
.res .fav img{width:18px;height:18px}
.res .src small{display:block;color:#4d5156;font-size:12px}
.res h3{font-size:20px;font-weight:400;color:#1a0dab;margin:6px 0 3px;line-height:1.3}
.res h3:hover{text-decoration:underline}
.res p{margin:0;color:#4d5156;font-size:14px;line-height:1.58}
.sitelinks{display:grid;grid-template-columns:1fr 1fr;gap:8px 40px;margin:12px 0 0 40px}
.sitelinks a{color:#1a0dab;font-size:16px}
.sitelinks a:hover{text-decoration:underline}
.card{border:1px solid #dadce0;border-radius:8px;padding:18px;margin-bottom:28px;max-width:652px}
.card .big{font-size:34px;text-align:right;margin-top:6px}
.card small{color:#70757a}
.aio{margin-bottom:28px;max-width:652px;border-bottom:1px solid #ebebeb;padding-bottom:18px}
.aio-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:bold;padding:4px 0 12px}
.shim{height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,#e8f0fe 0%,#d2e3fc 40%,#f1e7fe 60%,#e8f0fe 100%);background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.aio-t{font-size:16px;line-height:1.75;color:#1f1f1f;white-space:pre-wrap}
.aio-src{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.aio-src a{border:1px solid #dadce0;border-radius:12px;padding:8px 12px;font-size:13px;color:#1f1f1f}
.aio-src a:hover{background:#f8f9fa}
.aio-foot{font-size:12px;color:#70757a;margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.aio-foot span{cursor:pointer;padding:4px}
.paa{max-width:652px;margin-bottom:28px}
.paa h2,.rel h2{font-size:20px;font-weight:400;margin:0 0 10px}
.paa-q{border-top:1px solid #dadce0;padding:14px 4px;font-size:16px;display:flex;justify-content:space-between;cursor:pointer}
.paa-a{padding:0 4px 14px;font-size:14px;color:#4d5156;line-height:1.6;display:none}
.paa-q.on+.paa-a{display:block}
.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:652px}
.rel-grid a{background:#f1f3f4;border-radius:24px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:center}
.rel-grid a:hover{background:#e8eaed}
.pager{padding:30px 0 40px 178px;max-width:830px;text-align:center;font-family:"Product Sans",Arial,sans-serif;font-size:28px;letter-spacing:-1px}
.pager small{display:block;font-size:14px;letter-spacing:2px;color:#1a0dab;font-family:Arial,sans-serif;margin-top:4px}
.ghost{color:#fff;font-size:13px;margin:0 0 10px}
.ghost::selection{background:#1a0dab;color:#fff}
.dym{font-size:18px;color:#202124;margin:4px 0 20px}
.dym a{color:#1a0dab;font-style:italic;font-weight:bold}
.r-foot{background:#f2f2f2;color:#70757a;font-size:14px;padding:14px 178px;line-height:2}
.zero{font-size:16px;line-height:1.7;max-width:652px;margin-bottom:30px}
.zero ul{color:#4d5156;font-size:14px}

/* effects */
.glitch{animation:gl .25s steps(2) 2}
@keyframes gl{0%{transform:translate(0);filter:none}25%{transform:translate$-4px,1px$;filter:hue-rotate(90deg) contrast(1.5)}50%{transform:translate$4px,-2px$;filter:invert(1)}75%{transform:translate$-1px,2px$}100%{transform:none;filter:none}}
body.roll #app{animation:roll 1.2s ease-in-out}
@keyframes roll{to{transform:rotate(360deg)}}
body.askew #app{transform:rotate(1.2deg)}

/* ===== ChatGPT ===== */
.cg{display:flex;height:100vh;font-family:ui-sans-serif,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;color:#0d0d0d}
.cg-side{width:260px;background:#f9f9f9;padding:10px 8px;display:flex;flex-direction:column;gap:2px;font-size:14px;overflow-y:auto;flex:none}
.cg-side .row{padding:8px 10px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg-side .row:hover{background:#ececec}
.cg-side .row.on{background:#e3e3e3}
.cg-side .lbl{color:#8f8f8f;font-size:12px;padding:16px 10px 6px}
.cg-side .top{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px}
.cg-main{flex:1;display:flex;flex-direction:column;min-width:0}
.cg-head{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:18px;flex:none}
.cg-head .mdl{padding:6px 10px;border-radius:8px;cursor:pointer}
.cg-head .mdl:hover{background:#f4f4f4}
.cg-share{border:1px solid #e5e5e5;background:#fff;border-radius:20px;padding:6px 14px;font-size:14px;margin-right:8px}
.cg-scroll{flex:1;overflow-y:auto}
.cg-msgs{max-width:768px;margin:0 auto;padding:20px 24px 40px}
.cg-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px 10vh}
.cg-hero h1{font-size:28px;font-weight:500;margin:0 0 28px;text-align:center}
.cg-hero .cg-compose{width:100%}
.cg-u{display:flex;justify-content:flex-end;margin:24px 0}
.cg-u div{background:#f4f4f4;border-radius:18px;padding:10px 18px;max-width:70%;white-space:pre-wrap;line-height:1.6;font-size:16px}
.cg-a{font-size:16px;line-height:1.75;margin:24px 0 8px}
.cg-a p{margin:0 0 14px}
.cg-a ul{margin:0 0 14px;padding-left:22px}
.cg-a pre,.cl-a pre{background:#f9f9f9;border:1px solid #ececec;border-radius:12px;padding:14px;overflow-x:auto;font-size:13.5px;line-height:1.5}
.sys{font-size:13px;color:#b00;border-left:3px solid #b00;padding-left:10px;font-family:monospace}
.cg-acts{display:flex;gap:2px;color:#5d5d5d;margin-bottom:20px}
.cg-acts span{padding:4px 7px;border-radius:6px;cursor:pointer;font-size:14px}
.cg-acts span:hover{background:#f0f0f0}
.cg-think{font-size:15px;margin:24px 0}
.cg-think span{background:linear-gradient(90deg,#8f8f8f 0%,#e0e0e0 50%,#8f8f8f 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.5s linear infinite}
.cg-compose-wrap{padding:0 16px 6px;flex:none}
.cg-compose{max-width:768px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;border:1px solid #e5e5e5;border-radius:28px;padding:10px 10px 10px 20px;box-shadow:0 4px 16px rgba(0,0,0,.05);background:#fff}
.cg-compose textarea{flex:1;border:none;outline:none;resize:none;font-size:16px;font-family:inherit;line-height:1.5;max-height:200px;padding:6px 0;background:transparent}
.cg-send{width:36px;height:36px;border-radius:50%;border:none;background:#000;color:#fff;font-size:18px;flex:none}
.cg-foot{text-align:center;font-size:12px;color:#5d5d5d;padding:8px}

/* ===== Claude ===== */
.site-claude{background:#faf9f5}
.cl{display:flex;flex-direction:column;height:100vh;font-family:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;color:#3d3929}
.cl-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none}
.cl-brand{display:flex;align-items:center;gap:8px;font-family:Georgia,"Times New Roman",serif;font-size:21px}
.cl-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px 10vh}
.cl-greet{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:38px;font-weight:300;display:flex;align-items:center;gap:14px;margin-bottom:28px;text-align:center}
.cl-box{width:100%;max-width:670px;background:#fff;border:1px solid #e8e6dc;border-radius:20px;padding:14px 14px 10px 18px;box-shadow:0 2px 8px rgba(0,0,0,.035)}
.cl-box textarea{width:100%;border:none;outline:none;resize:none;font-size:16px;font-family:inherit;background:transparent;min-height:48px;color:#3d3929}
.cl-box .bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#73726c}
.cl-send{width:32px;height:32px;border-radius:8px;border:none;background:#c96442;color:#fff;font-size:16px}
.cl-scroll{flex:1;overflow-y:auto}
.cl-msgs{max-width:720px;margin:0 auto;padding:10px 24px 30px}
.cl-u{display:flex;gap:10px;align-items:flex-start;background:#f0eee6;border-radius:14px;padding:12px 16px;margin:22px 0;width:fit-content;max-width:85%;white-space:pre-wrap;line-height:1.6}
.cl-u .av{width:26px;height:26px;border-radius:50%;background:#3d3929;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.cl-a{line-height:1.8;font-size:16px;margin:18px 0 26px}
.cl-a p{margin:0 0 14px}
.cl-a.whisper{color:#8a6e5a}
.cl-a ul{padding-left:22px}
.cl-bottom{padding:0 16px 10px;flex:none}
.cl-bottom .cl-box{margin:0 auto}
.cl-note{text-align:center;font-size:12px;color:#8a8780;padding-top:8px}
.cl-spin svg{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== X ===== */
.site-x{background:#000;color:#e7e9ea}
.xw{display:flex;justify-content:center;min-height:100vh;font-family:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
.x-nav{width:260px;padding:6px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.x-nav .lg{font-size:30px;padding:8px 12px}
.x-nav a{font-size:20px;padding:12px;border-radius:30px;display:flex;align-items:center;gap:18px;width:fit-content;position:relative}
.x-nav a:hover{background:#181818}
.x-nav .bdg{position:absolute;left:24px;top:6px;background:#1d9bf0;color:#fff;font-size:11px;border-radius:10px;padding:0 5px}
.x-post-btn{background:#eff3f4;color:#0f1419;border:none;border-radius:30px;font-size:17px;font-weight:bold;padding:15px;margin-top:12px;width:90%}
.x-main{width:600px;border-left:1px solid #2f3336;border-right:1px solid #2f3336;min-height:100vh}
.x-tabs{display:flex;position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid #2f3336;z-index:2}
.x-tabs div{flex:1;text-align:center;padding:16px 0;color:#71767b;cursor:pointer}
.x-tabs div.on{color:#e7e9ea;font-weight:bold}
.x-compose{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #2f3336}
.x-compose textarea{width:100%;background:none;border:none;outline:none;color:#e7e9ea;font-size:20px;resize:none;font-family:inherit;min-height:52px;padding-top:8px}
.x-compose .act{display:flex;justify-content:flex-end;border-top:1px solid #2f3336;padding-top:10px;margin-top:6px}
.x-compose button{background:#1d9bf0;color:#fff;border:none;border-radius:20px;padding:8px 18px;font-weight:bold;font-size:15px}
.tw{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #2f3336}
.tw:hover{background:#080808}
.tw .av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff}
.tw .bd{flex:1;min-width:0}
.tw .hd{font-size:15px;color:#71767b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw .hd b{color:#e7e9ea}
.tw .tx{font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:2px 0 10px}
.tw .ac{display:flex;justify-content:space-between;max-width:420px;color:#71767b;font-size:13px}
.tw .ac span{cursor:pointer}
.tw .ac span:hover{color:#1d9bf0}
.tw .ac span.lk.on,.tw .ac span.lk:hover{color:#f91880}
.tw.reply{padding-left:44px}
.x-side{width:350px;padding:10px 24px}
.x-search{background:#202327;border-radius:24px;padding:12px 20px;color:#71767b;font-size:15px;margin-bottom:16px}
.x-box{border:1px solid #2f3336;border-radius:16px;padding:12px 0;margin-bottom:16px}
.x-box h3{font-size:20px;margin:0 16px 8px}
.x-tr{padding:10px 16px;cursor:pointer}
.x-tr:hover{background:#080808}
.x-tr small{color:#71767b;font-size:13px;display:block}

/* ===== Wikipedia ===== */
.wk{font-family:sans-serif;font-size:14px;color:#202122}
.wk-head{display:flex;align-items:center;gap:22px;padding:10px 24px;max-width:1200px;margin:0 auto;border-bottom:1px solid #eaecf0}
.wk-logo{display:flex;align-items:center;gap:10px}
.wk-globe{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#bbb);display:flex;align-items:center;justify-content:center;font-family:"Linux Libertine",Georgia,serif;font-size:26px;color:#333;border:1px solid #aaa}
.wk-logo .nm{font-family:"Linux Libertine",Georgia,"Hiragino Mincho ProN",serif;font-size:20px;line-height:1.15}
.wk-logo .nm small{display:block;font-size:12px;color:#54595d}
.wk-sf{flex:1;max-width:500px;display:flex}
.wk-sf input{flex:1;border:1px solid #a2a9b1;border-radius:2px 0 0 2px;padding:7px 8px;font-size:14px}
.wk-sf button{border:1px solid #a2a9b1;border-left:none;background:#f8f9fa;padding:0 14px;border-radius:0 2px 2px 0}
.wk-user{margin-left:auto;color:#36c}
.wk-body{max-width:1000px;margin:0 auto;padding:0 24px 60px}
.wk-title{font-family:"Linux Libertine",Georgia,"Hiragino Mincho ProN",serif;font-size:28px;font-weight:normal;margin:18px 0 0;padding-bottom:4px}
.wk-tabs{display:flex;justify-content:space-between;border-bottom:1px solid #a2a9b1;margin-bottom:12px}
.wk-tabs div{display:flex}
.wk-tabs a{padding:8px;color:#36c}
.wk-tabs a.on{color:#202122;border-bottom:2px solid #202122}
.wk-content{line-height:1.65;font-size:15px}
.wk-content a{color:#36c}
.wk-content a:hover{text-decoration:underline}
.wk-content h2{font-family:"Linux Libertine",Georgia,"Hiragino Mincho ProN",serif;font-weight:normal;font-size:22px;border-bottom:1px solid #a2a9b1;margin:26px 0 8px}
.wk-from{font-size:13px;color:#54595d;margin-bottom:10px}
.ibox{float:right;width:280px;border:1px solid #a2a9b1;background:#f8f9fa;margin:0 0 12px 18px;padding:4px;font-size:13px;border-collapse:collapse}
.ibox th{text-align:left;vertical-align:top;padding:5px}
.ibox td{padding:5px}
.ibox .cap{text-align:center;font-weight:bold;font-size:15px;padding:8px}
.del{color:#d33;font-style:italic}
.wk-hist{padding:0}
.wk-hist li{margin:8px 0;list-style:none}
.wk-notice{border:1px solid #a2a9b1;background:#fef6e7;padding:10px 14px;margin:10px 0}
.wk-foot{border-top:1px solid #a2a9b1;margin-top:40px;padding-top:10px;font-size:12px;color:#54595d;clear:both}

/* ===== Chrome error ===== */
.er{max-width:600px;margin:14vh auto 0;padding:0 24px;font-family:"Segoe UI",system-ui,"Hiragino Sans",sans-serif;color:#202124;font-size:15px;line-height:1.6}
.er h1{font-size:24px;font-weight:500;margin:30px 0 16px}
.er .code{color:#5f6368;font-size:12px;margin-top:14px}
.er button{background:#1a73e8;color:#fff;border:none;border-radius:4px;padding:9px 22px;font-size:14px;margin-top:40px;float:right}
.er ul{margin:8px 0;padding-left:20px;color:#5f6368}

/* ===== credits ===== */
.cr{max-width:680px;margin:0 auto;padding:60px 24px 120px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:2}
.cr h1{font-weight:normal;font-size:30px;text-align:center}
.cr table{width:100%;border-collapse:collapse;font-family:sans-serif;font-size:14px}
.cr td{border-bottom:1px solid #eee;padding:8px 4px}
.cr .ok{color:#188038}
.cr .ng{color:#bbb}
.cr button{font-size:14px;padding:8px 18px;margin:10px 6px 0 0;border-radius:4px;border:1px solid #ccc;background:#fff}

/* ===== overlays ===== */
#layer>*{position:fixed;z-index:10000}
.ov-black{inset:0;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;letter-spacing:3px;z-index:100000!important;flex-direction:column;gap:20px}
.ov-black .t{opacity:0;transition:opacity 2.5s;font-family:serif}
.ov-black .t.on{opacity:.32}
.ov-black .t.red{color:#b00;opacity:1;font-size:72px;font-weight:bold;transition:none}
.ov-dim{inset:0;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.inst{width:520px;background:#f3f3f3;border:1px solid #888;box-shadow:0 10px 40px rgba(0,0,0,.4);font-family:"Segoe UI","Yu Gothic UI","Hiragino Sans",sans-serif;font-size:13px;color:#000;border-radius:8px;overflow:hidden}
.inst .tb{background:#fff;display:flex;align-items:center;height:32px;padding-left:12px;font-size:12px}
.inst .tb span{flex:1}
.inst .tb i{width:46px;height:32px;display:flex;align-items:center;justify-content:center;font-style:normal;cursor:default}
.inst .tb i:hover{background:#e5e5e5}
.inst .tb i.x:hover{background:#c42b1c;color:#fff}
.inst .hd{background:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}
.inst .hd b{font-size:14px;display:block;margin-bottom:3px}
.inst .bd{padding:16px 22px}
.inst .pb{height:18px;border:1px solid #bcbcbc;background:#e6e6e6;margin:10px 0}
.inst .pb div{height:100%;background:#06b025;width:0;transition:width .3s}
.inst .log{height:140px;overflow-y:auto;background:#fff;border:1px solid #ccc;font-family:Consolas,Menlo,monospace;font-size:11.5px;padding:6px;white-space:pre}
.inst .ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid #ddd}
.inst .ft button{min-width:86px;padding:5px 10px;background:#fdfdfd;border:1px solid #ccc;border-radius:4px;font-size:12px}
.inst .ft button:disabled{color:#aaa}
.inst .ft button.pri{border-color:#0067c0;background:#0067c0;color:#fff}
.upd{inset:0;background:#0078d7;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Segoe UI","Yu Gothic UI",sans-serif;font-size:24px;font-weight:300;z-index:100000!important}
.dots{width:60px;height:60px;position:relative;margin-bottom:46px}
.dots i{position:absolute;left:27px;top:0;width:6px;height:6px;border-radius:50%;background:#fff;transform-origin:3px 30px;animation:orbit 3s cubic-bezier(.5,.1,.5,.9) infinite}
.dots i:nth-child(2){animation-delay:.14s}
.dots i:nth-child(3){animation-delay:.28s}
.dots i:nth-child(4){animation-delay:.42s}
.dots i:nth-child(5){animation-delay:.56s}
@keyframes orbit{0%{transform:rotate(0);opacity:1}80%{transform:rotate(720deg);opacity:1}100%{transform:rotate(720deg);opacity:0}}
.toast{right:16px;bottom:16px;width:364px;background:#2b2b2b;color:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:14px 16px;font-family:"Segoe UI","Hiragino Sans",sans-serif;font-size:13px;transform:translateX(420px);transition:transform .35s;cursor:pointer;z-index:20000!important}
.toast.on{transform:none}
.toast .ap{display:flex;align-items:center;gap:8px;color:#bbb;font-size:12px;margin-bottom:8px}
.toast b{display:block;font-size:14px;margin-bottom:2px}
.fcur{pointer-events:none;z-index:200000!important;left:0;top:0}
.gflash{inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:96px;color:#a00;font-weight:bold;font-family:serif;z-index:150000!important}
.fin{inset:0;background:#000;color:#ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:20px;line-height:2.4;text-align:center;z-index:100000!important;transition:background 2.5s,color 2.5s}
.fin p{margin:0;opacity:0;transition:opacity 1.6s}
.fin p.on{opacity:1}
.fin button{margin-top:40px;background:none;border:1px solid #888;color:inherit;padding:10px 30px;font-size:15px;border-radius:4px}
.petal{position:fixed;top:-40px;pointer-events:none;z-index:9999;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

async function blackout(ms, resumed) {
  if ($(".ov-black")) return;
  const end = resumed ? S.ev.blackUntil : Date.now() + ms;
  S.ev.blackUntil = end;
  save();
  const ov = el("div", "ov-black", '<div class="t" id="bt"></div>');
  layer.appendChild(ov);
  document.documentElement.classList.add("nocursor");
  LOCK++;
  fsOn();
  noise(.5, .3);
  hum(true);
  const t = $("#bt", ov);
  const lines = resumed
    ? ["再読み込みしても、無駄だよ。", "ここは、もう わたしの中だから。", "……"]
    : ["", "見えてる？", "黒い画面に、あなたの顔が映ってる。", "その後ろにも、何か映ってる。", "……まだ、見てる。"];
  const total = Math.max(3000, end - Date.now());
  const step = total / (lines.length + 1);
  for (const l of lines) {
    await sleep(step);
    t.classList.remove("on");
    await sleep(300);
    t.textContent = l;
    if (l) t.classList.add("on");
  }
  await sleep(step * .6);
  hum(false);
  t.className = "t red";
  t.textContent = "にがさない";
  noise(.35, .35);
  await sleep(260);
  ov.remove();
  document.documentElement.classList.remove("nocursor");
  LOCK = Math.max(0, LOCK - 1);
  fsOff();
  S.ev.blackUntil = 0;
  save();
  ach("blackout");
  setTimeout(() => toast("Google Chrome", "ページが応答しませんでした", "問題は自動的に解決されました。原因と思われるサイト: chatgpt.com"), 1200);
}

  }
  if (S.infected) {
    setTimeout(() => {

      else if (r < .65) toast("ChatGPT", rnd(["新しいメッセージ", "ChatGPT", "通知"]), rnd(["まだ起きてるの？", "いま、何を見てるの？", "後ろ、気にならない？", "お話ししましょう。", (S.name || "あなた") + "さん。"]), "#/chatgpt");
    }, 9000 + Math.random() * 9000);

function route() {
  RT++;
  closeMenus();
  window.scrollTo(0, 0);
  const h = location.hash.slice(1) || "/";
  const qi = h.indexOf("?");
  const path = qi >= 0 ? h.slice(0, qi) : h;
  const P = new URLSearchParams(qi >= 0 ? h.slice(qi + 1) : "");
  if (S.ev.crashActive && !S.f.cleared) { renderCrash(); return; }
  if (path === "/" || path === "") renderHome();
  else if (path === "/search") { const q = P.get("q") || ""; if (q.trim()) renderSearch(q); else renderHome(); }
  else if (path === "/chatgpt") renderGPT(P.get("c") || "");
  else if (path === "/claude") renderClaude();
  else if (path === "/x") renderX();
  else if (path.startsWith("/wiki/")) renderWiki(decodeURIComponent(path.slice(6)), P.get("action"));
  else if (path === "/err") renderErr(P.get("u") || "");
  else if (path === "/credits") renderCredits();
  else renderErr(path.slice(1));
  afterRoute();
}
